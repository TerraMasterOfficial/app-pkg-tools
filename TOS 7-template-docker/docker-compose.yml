# ============================================================
# Docker Application Template — docker-compose.yml
# Reference: TOS 7 Application Development Guide, Chapter 9
#   (09_Docker_Development.md, Sections 9.3 / 9.4 / 9.5)
#
# BEFORE SUBMISSION, verify the following rules are all met:
#   [ ] Compose Spec 3.8+ compatible
#   [ ] Image from Docker Hub ONLY (official / verified / well-known community),
#       with a FIXED version tag — never ":latest"
#   [ ] container_name == application id (must match exactly)
#   [ ] restart: unless-stopped
#   [ ] All data directories mounted to absolute host paths under
#       /Volume1/DockerAppData/<appid>/ — NEVER write "/Volume*/..." (the
#       platform does not expand "*": it would create a literal "/Volume*" dir)
#   [ ] NO comment lines inside the "volumes:" / "ports:" sequences — the
#       installer parses those two blocks line by line, and a "#" line makes it
#       abort the block early (the chown step is then silently skipped)
#   [ ] No privileged mode, no network_mode: host
#   [ ] Non-root user via user field
#   [ ] Host port NOT in disabled list: 22, 80, 443, 8181, 5050
#       (recommended range: 8000-19999, and must not be occupied on TNAS)
#   [ ] TZ environment variable configured
#   [ ] Healthcheck defined for EVERY service
#   [ ] Every named volume is ALSO declared under the top-level "volumes:" key.
#       This template uses bind mounts, so no top-level declaration is needed —
#       but if you switch to a named volume ("<name>:/path"), a service-level
#       reference alone makes Compose reject the whole project before pulling
#       any image ('service "x" refers to undefined volume "y"'), and App
#       Center installation fails immediately.
#   [ ] The compose "user" UID:GID matches the UID the platform assigns to the
#       app (normally 1000:1000). If the image hard-codes its runtime user and
#       does not support PUID/PGID, set it to that image's own UID:GID
#       (guide 10.3.1).
#   [ ] x-app-meta appended at the END of this file (Web UI apps only)
# ============================================================

version: "3.8"

services:
  # 👇 <appid> — replace "myapp-docker" with your application id everywhere
  myapp-docker:
    # 👇 Docker Hub image with a LOCKED version tag.
    #    Priority: 1. Docker Hub official project images (nginx, postgres)
    #              2. Docker Hub verified publishers (Verified badge)
    #              3. Docker Hub well-known community images (linuxserver/*)
    #    Rejected: non-Docker Hub registries (ghcr.io, quay.io, private repos)
    #              and unverified personal images. NEVER use ":latest".
    image: yourname/myapp:1.0.0
    container_name: myapp-docker          # MUST match the application id
    restart: unless-stopped               # normal services use unless-stopped
    # 👇 Data persistence: every data directory must be mounted to an absolute
    #    host path under /Volume1/DockerAppData/<appid>/. Data kept only inside
    #    the container is LOST when the container is removed.
    #    NEVER write "/Volume*/..." — the platform does not expand "*".
    #    Prefer a bind mount (as below). If you use a named volume instead
    #    ("<name>:/path"), you MUST also declare it under the top-level
    #    "volumes:" key, otherwise Compose rejects the project before pulling
    #    any image ("service x refers to undefined volume y").
    #    NEVER put comment lines INSIDE the volumes: / ports: sequences below:
    #    the installer parses those two blocks line by line, and a "#" line
    #    aborts the block (the chown of the mounted dirs is silently skipped).
    volumes:
      - /Volume1/DockerAppData/myapp-docker/config:/config
      - /Volume1/DockerAppData/myapp-docker/data:/data
    # 👇 "host_port:container_port"; host_port must be inside the recommended
    #    range 8000-19999 and must NOT be 22 / 80 / 443 / 8181 / 5050.
    ports:
      - "8080:8080"
    environment:
      # 👇 Timezone: MUST be explicitly configured.
      #    Fixed default + user-overridable form (via .env / environment).
      - TZ=Asia/Shanghai
      - TZ=${TZ:-Asia/Shanghai}           # allow user override, default Asia/Shanghai
      - PUID=1000
      - PGID=1000
    # 👇 Non-root user is REQUIRED. Running as root is strictly prohibited.
    #    privileged: true is strictly prohibited.
    #    network_mode: host is strictly prohibited (use port mapping instead).
    user: "1000:1000"
    # 👇 Healthcheck is REQUIRED for every service.
    #    After 3 consecutive failures the app is marked "Abnormal".
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

# ============================================================
# x-app-meta — REQUIRED for Docker applications WITH a Web UI.
#              Must be appended at the END of the file (after the services
#              block). For applications WITHOUT a UI, remove this section.
# web.port    = host port mapped in the ports section (8080 here)
# web.protocol = request protocol, typically http
# ============================================================
x-app-meta:
  web:
    port: 8080
    protocol: http

# ============================================================
# Multi-container startup order example (e.g. Web + Database):
#   services:
#     app-db:
#       image: postgres:16
#       healthcheck:
#         test: ["CMD-SHELL", "pg_isready -U postgres"]
#         interval: 10s
#         timeout: 5s
#         retries: 5
#     app-web:
#       image: yourname/myapp:1.0.0
#       depends_on:
#         app-db:
#           condition: service_healthy
#       healthcheck:
#         test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
#         interval: 30s
#         timeout: 10s
#         retries: 3
#   - depends_on with condition: service_healthy ensures correct startup order
#   - Health checks must be defined for every service
# ============================================================
