<?xml version="1.0" encoding="UTF-8"?>
<!--
  Application icon for the Docker application template.
  File name MUST be: <appid>.svg  (here: myapp-docker.svg)
  Placeholder icon — replace with your own SVG artwork (128x128 recommended).
  Note: config.ini "icon" field points to /images/icons/<appid>.svg;
  the platform maps it to the package-root <appid>.svg during installation.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c6dd0"/>
      <stop offset="100%" stop-color="#0f3a78"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>
  <!-- Docker whale body -->
  <path d="M26 82c0-14 6-26 16-34 3-8 9-14 17-17 1 6 6 11 13 13 3 1 6 1 9 1 3 6 5 13 5 21l-60 16z" fill="#ffffff"/>
  <!-- Container stacks -->
  <rect x="34" y="58" width="10" height="14" rx="2" fill="#2396ed"/>
  <rect x="48" y="54" width="10" height="18" rx="2" fill="#2396ed"/>
  <rect x="62" y="58" width="10" height="14" rx="2" fill="#2396ed"/>
  <!-- Whale eye -->
  <circle cx="46" cy="62" r="2.5" fill="#0f3a78"/>
  <!-- Waves -->
  <path d="M28 96h72" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M36 104h56" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
</svg>
